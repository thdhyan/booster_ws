# ros2_control hardware interface config for K1
# Used by k1_sim_gazebo (GazeboSystem plugin) and real robot bridge
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

joint_state_broadcaster:
  ros__parameters:
    joints:
      - Left_Hip_Pitch
      - Left_Hip_Roll
      - Left_Hip_Yaw
      - Left_Knee_Pitch
      - Left_Ankle_Pitch
      - Left_Ankle_Roll
      - Right_Hip_Pitch
      - Right_Hip_Roll
      - Right_Hip_Yaw
      - Right_Knee_Pitch
      - Right_Ankle_Pitch
      - Right_Ankle_Roll
      - Left_Shoulder_Pitch
      - Left_Shoulder_Roll
      - Left_Elbow_Pitch
      - Left_Elbow_Yaw
      - Right_Shoulder_Pitch
      - Right_Shoulder_Roll
      - Right_Elbow_Pitch
      - Right_Elbow_Yaw
      - Head_yaw
      - Head_pitch

k1_joint_controller:
  ros__parameters:
    joints:
      - Left_Hip_Pitch
      - Left_Hip_Roll
      - Left_Hip_Yaw
      - Left_Knee_Pitch
      - Left_Ankle_Pitch
      - Left_Ankle_Roll
      - Right_Hip_Pitch
      - Right_Hip_Roll
      - Right_Hip_Yaw
      - Right_Knee_Pitch
      - Right_Ankle_Pitch
      - Right_Ankle_Roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      Left_Hip_Pitch: {p: 100.0, i: 0.0, d: 2.0}
      Left_Hip_Roll:  {p: 100.0, i: 0.0, d: 2.0}
      Left_Hip_Yaw:   {p: 50.0,  i: 0.0, d: 1.0}
      Left_Knee_Pitch: {p: 200.0, i: 0.0, d: 4.0}
      Left_Ankle_Pitch: {p: 40.0, i: 0.0, d: 1.0}
      Left_Ankle_Roll:  {p: 40.0, i: 0.0, d: 1.0}
      Right_Hip_Pitch: {p: 100.0, i: 0.0, d: 2.0}
      Right_Hip_Roll:  {p: 100.0, i: 0.0, d: 2.0}
      Right_Hip_Yaw:   {p: 50.0,  i: 0.0, d: 1.0}
      Right_Knee_Pitch: {p: 200.0, i: 0.0, d: 4.0}
      Right_Ankle_Pitch: {p: 40.0, i: 0.0, d: 1.0}
      Right_Ankle_Roll:  {p: 40.0, i: 0.0, d: 1.0}
