name: CI — colcon build

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:
    branches:
      - main
      - dev/**

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Add ROS2 Jazzy repository
        run: |
          sudo curl -sSL https://repo.ros2.org/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

      - name: Update package index
        run: sudo apt-get update

      - name: Install ROS2 Jazzy base
        run: sudo apt-get install -y ros-jazzy-ros-base

      - name: Initialize rosdep
        run: |
          sudo rosdep init || true
          rosdep update

      - name: Install dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Install colcon
        run: |
          sudo apt-get install -y python3-colcon-common-extensions

      - name: Build core packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select k1_interfaces k1_description k1_locomotion

      - name: Run tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select k1_interfaces
